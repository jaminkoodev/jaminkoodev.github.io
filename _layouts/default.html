<!doctype html>
<html lang="en">
  <head>
    {% include meta.html %}
    <title>{% if page.title and page.title != 'Portfolio' %}{{ page.title }} · {% endif %}{{ site.name }}</title>
    <link rel="canonical" href="{{ site.url }}{{ page.url }}">
    <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
    <link rel="alternate" type="application/rss+xml" title="{{ site.name }} — writing" href="{{ '/feed.xml' | relative_url }}">
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header">
      <div class="shell header-inner">
        <a class="brand" href="{{ '/' | relative_url }}" aria-label="Jamin Koo, home">
          <span class="brand-mark" aria-hidden="true">JK</span>
          <span>Jamin Koo<span class="brand-dot">.</span></span>
        </a>
        <nav class="main-nav" aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}#work">Work</a>
          <a href="{{ '/writing/' | relative_url }}">Writing</a>
          <a href="{{ '/about/' | relative_url }}">About</a>
          <a class="nav-github" href="https://github.com/jaminkoodev">GitHub <span aria-hidden="true">↗</span></a>
        </nav>
      </div>
    </header>

    <main id="main" class="site-main">{{ content }}</main>

    <footer class="site-footer">
      <div class="shell footer-inner">
        <div>
          <strong>Jamin Koo</strong>
          <span>Backend · Data Systems · ML Systems</span>
        </div>
        <div class="footer-links">
          <a href="mailto:jmkoo.dev@gmail.com">Email</a>
          <a href="https://github.com/jaminkoodev">GitHub</a>
          <a href="{{ '/writing/' | relative_url }}">Writing</a>
        </div>
      </div>
    </footer>
  </body>
</html>
